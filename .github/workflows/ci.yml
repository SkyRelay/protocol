name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # Pinned on purpose. Every gas figure in docs/onchain.md was measured on
      # this version, and forge changes gas accounting between releases: the
      # same unchanged call measures differently on 1.7 and 1.8. A floating
      # toolchain makes the published numbers unreproducible.
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Vectors are reproducible
        run: |
          pnpm run vectors
          git diff --exit-code -- vectors/

      - name: Full pipeline (unit tests + forge)
        run: pnpm verify

      - name: Solidity formatting
        run: forge fmt --check
        working-directory: contracts
