name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: foundry-rs/foundry-toolchain@v1

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Vectors are reproducible
        run: |
          pnpm run vectors
          git diff --exit-code -- vectors/

      - name: Full pipeline (unit tests + forge)
        run: pnpm verify

      - name: Solidity formatting
        run: forge fmt --check
        working-directory: contracts
